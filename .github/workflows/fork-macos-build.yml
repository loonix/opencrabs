name: Fork macOS build (arm64)

# Fork-only. Builds the macOS arm64 binaries (TUI + GUI) on a GitHub-hosted
# runner, because upstream's prerelease.yml targets a self-hosted Mac runner
# this fork does not have. Lives on `build/**` branches of the fork and never
# reaches upstream main.

on:
  push:
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-macos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: opencrabs (macos-arm64)
    if: github.repository != 'opencrabs/opencrabs'
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      - name: Build
        env:
          CFLAGS: -march=armv8-a+crypto
          CXXFLAGS: -march=armv8-a+crypto
        run: cargo build --locked --profile ci --target aarch64-apple-darwin --all-features

      - name: Package
        run: |
          cd target/aarch64-apple-darwin/ci
          for b in opencrabs opencrabs-gui; do
            test -f "$b" || { echo "::error::$b was not built"; exit 1; }
            strip "$b"
          done
          git rev-parse HEAD > SOURCE-COMMIT.txt
          shasum -a 256 opencrabs opencrabs-gui | tee SHA256SUMS
          tar czf "$GITHUB_WORKSPACE/opencrabs-macos-arm64.tar.gz" opencrabs opencrabs-gui SOURCE-COMMIT.txt SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: opencrabs-macos-arm64
          path: opencrabs-macos-arm64.tar.gz
          retention-days: 7
